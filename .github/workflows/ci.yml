# M7 CI: checks only. No secrets, no publish/release/deploy/upload steps, read-only token, no repo settings.
# Network is used only to fetch the pinned actions and the locked dependencies (bun install --frozen-lockfile);
# no test talks to a live new-api server (live tests are `bun run test:live`, never run here). See docs/ci.md.
name: ci
on:
  push:
    branches: ['feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PA_REQUIRE_WEB_DEPS: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
      - name: Install (frozen lockfiles)
        run: bun install --frozen-lockfile
      - name: Install vendored web deps
        run: bun run install:web
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Tests (unit + security suite + local pages; missing web deps fail)
        run: bun run test
      - name: Compat + licenses
        run: bun run compat && bun run licenses
      - name: Product config passes the static source-offer check (no placeholders; reachability is checked only by --official)
        working-directory: apps/desktop
        run: PA_LOCAL_BUILD=0 node scripts/check-placeholders.cjs
      - name: Official guard (--official) refuses when packaging conditions are not met (independent of the real config)
        working-directory: apps/desktop
        run: |
          set -u
          refuse() { local want="$1"; shift; if "$@" 2> guard.err; then echo "guard unexpectedly passed: $*"; exit 1; fi; cat guard.err; grep -q "$want" guard.err; }
          # 1. fixture config with placeholders (copy of the guard in a temp repo layout), even with PA_LOCAL_BUILD=1 inherited
          T=$(mktemp -d); mkdir -p "$T/apps/desktop/scripts" "$T/packages/core/src"
          cp scripts/check-placeholders.cjs "$T/apps/desktop/scripts/"
          jq '.["$placeholders"]=["sourceUrl","sourceOffer"] | .sourceOffer="PLACEHOLDER: source offer pending."' ../../packages/core/src/product.config.json > "$T/packages/core/src/product.config.json"
          (cd "$T/apps/desktop" && refuse 'unreplaced placeholder' env PA_LOCAL_BUILD=1 node scripts/check-placeholders.cjs --official)
          echo 'working tree status before the real-config cases:'; git status --porcelain
          # 2. real config, PA_BUILD_COMMIT that is not HEAD
          refuse 'does not match git HEAD\|working tree is dirty' env PA_BUILD_COMMIT=0000000000000000000000000000000000000000 node scripts/check-placeholders.cjs --official
          # 3. real config, dirty working tree
          touch ci-dirty-marker.txt
          refuse 'working tree is dirty' node scripts/check-placeholders.cjs --official
          rm -f ci-dirty-marker.txt guard.err; rm -rf "$T"
      - name: Production build
        working-directory: apps/desktop
        run: bun run build:prod
      - name: Bundle scan
        run: node scripts/scan-bundle.mjs
