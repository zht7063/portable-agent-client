# M7 CI: checks only. No secrets, no publish/release/deploy/upload steps, read-only token, no repo settings.
# Network is used only to fetch the pinned actions and the locked dependencies (bun install --frozen-lockfile);
# no test talks to a live new-api server (live tests are `bun run test:live`, never run here). See docs/ci.md.
name: ci
on:
  push:
    branches: ['feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PA_REQUIRE_WEB_DEPS: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
      - name: Install (frozen lockfiles)
        run: bun install --frozen-lockfile
      - name: Install vendored web deps
        run: bun run install:web
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Tests (unit + security suite + local pages; missing web deps fail)
        run: bun run test
      - name: Compat + licenses
        run: bun run compat && bun run licenses
      - name: Product config passes the static source-offer check (no placeholders; reachability is checked only by --official)
        working-directory: apps/desktop
        run: PA_LOCAL_BUILD=0 node scripts/check-placeholders.cjs
      - name: Production build
        working-directory: apps/desktop
        run: bun run build:prod
      - name: Bundle scan
        run: node scripts/scan-bundle.mjs
