# OFFICIAL installer builds (manual dispatch only): Windows unsigned; macOS ad-hoc signed only; no release/publish
# step, no secrets. Runs the official pack scripts, whose --official guard REFUSES until the source repo is public and
# reachable at the build commit. Artifacts (official file names) + .sha256 kept 7 days. See docs/release.md.
name: release-build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true
env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  PA_REQUIRE_WEB_DEPS: '1'
jobs:
  win:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
      - run: bun install --frozen-lockfile
      - run: bun run install:web
      - name: Pack NSIS x64 (OFFICIAL, unsigned, publish never; guard runs first)
        working-directory: apps/desktop
        run: bun run pack:win
      - name: Verify final installer asar policy
        run: node scripts/check-asar.mjs
      - name: Bundle scan
        run: node scripts/scan-bundle.mjs
      - name: Checksums
        working-directory: apps/desktop/release
        run: |
          ls -la
          for f in swift-client-*.exe; do sha256sum "$f" > "$f.sha256"; cat "$f.sha256"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: swift-client-win-x64
          path: |
            apps/desktop/release/swift-client-*.exe
            apps/desktop/release/swift-client-*.exe.sha256
          if-no-files-found: error
          retention-days: 7
  mac:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
      - run: bun install --frozen-lockfile
      - run: bun run install:web
      - name: Pack dmg arm64 + x64 (OFFICIAL, ad-hoc signed, publish never; guard runs first)
        working-directory: apps/desktop
        run: bun run pack:mac
      - name: Verify ad-hoc code signature (mac)
        working-directory: apps/desktop/release
        run: |
          for app in mac*/*.app; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2> sig.txt; cat sig.txt
            grep -q 'Signature=adhoc' sig.txt
          done
          rm -f sig.txt
      - name: Verify final installer asar policy
        run: node scripts/check-asar.mjs
      - name: Bundle scan
        run: node scripts/scan-bundle.mjs
      - name: Checksums
        working-directory: apps/desktop/release
        run: |
          ls -la
          for f in swift-client-*.dmg; do shasum -a 256 "$f" > "$f.sha256"; cat "$f.sha256"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: swift-client-mac
          path: |
            apps/desktop/release/swift-client-*.dmg
            apps/desktop/release/swift-client-*.dmg.sha256
          if-no-files-found: error
          retention-days: 7
